name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Doctor
        run: factory doctor
      - name: Tests
        run: pytest -q
      - name: Runtime reference run (no model)
        run: |
          export FACTORY_ROOT="$RUNNER_TEMP/factory-run"
          export FACTORY_RUNS_ROOT="$FACTORY_ROOT/runs"
          set +e
          factory run --run-id ci-nano --executor fake --max-steps 4
          code=$?
          set -e
          test "$code" = 2
          factory gate approve --run-id ci-nano --gate gate_s00 \
            --approver human:ci --evidence "ci stand-in"
          factory verify --run-id ci-nano --stage s00_intake
      - name: Build reference run
        run: python examples/build_nano_todo.py
      - name: Verify reference run
        env:
          FACTORY_ROOT: ${{ github.workspace }}/examples/nano-todo
          FACTORY_RUNS_ROOT: ${{ github.workspace }}/examples
        run: |
          factory verify --run-id nano-todo --stage s9_learn --require-gate
          factory trace --run-id nano-todo
          factory metrics --run-id nano-todo
          factory log verify --run-id nano-todo
      - name: Product tests
        run: python -m unittest discover -s examples/nano-todo/product/tests -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Test the built sdist in a clean environment
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --upgrade pip pytest
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          mkdir -p /tmp/sdist-src
          tar -xzf dist/*.tar.gz -C /tmp/sdist-src --strip-components=1
          cd /tmp/sdist-src
          /tmp/sdist-venv/bin/python -m pytest -q
