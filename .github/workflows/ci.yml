name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Doctor
        run: factory doctor
      - name: Tests
        run: pytest -q
      - name: Build reference run
        run: python examples/build_nano_todo.py
      - name: Verify reference run
        env:
          FACTORY_ROOT: ${{ github.workspace }}/examples/nano-todo
          FACTORY_RUNS_ROOT: ${{ github.workspace }}/examples
        run: |
          factory verify --run-id nano-todo --stage s9_learn --require-gate
          factory trace --run-id nano-todo
          factory metrics --run-id nano-todo
          factory log verify --run-id nano-todo
      - name: Product tests
        run: python -m unittest discover -s examples/nano-todo/product/tests -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
