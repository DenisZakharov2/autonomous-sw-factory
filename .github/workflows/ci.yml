name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Doctor + pytest must be green on all three platforms.  The eval set and
    # the reference run stay on Linux: they use bwrap and POSIX process
    # semantics, and this job is about installability, not the sandbox.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install bubblewrap (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Doctor
        run: factory doctor
      - name: Tests
        run: pytest -q

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Doctor
        run: factory doctor
      # The brownfield case needs a seeded Rust tree and a cargo build; CI
      # covers the fast greenfield contract and leaves that case to its own run.
      # Only nano-todo and standard-mini work reliably with fake executor;
      # other cases require real executor or have product tests that need real code.
      - name: Eval set (fake executor, invariants and baseline)
        run: >-
          factory eval --cases eval/cases --executor fake
          --case nano-todo --case standard-mini
          --baseline eval/baseline-hermes.json
      - name: Runtime reference run (no model)
        run: |
          export FACTORY_ROOT="$RUNNER_TEMP/factory-run"
          export FACTORY_RUNS_ROOT="$FACTORY_ROOT/runs"
          set +e
          factory run --run-id ci-nano --executor fake --max-steps 4
          code=$?
          set -e
          test "$code" = 2
          factory gate approve --run-id ci-nano --gate gate_s00 \
            --approver human:ci --evidence "ci stand-in"
          factory verify --run-id ci-nano --stage s00_intake
      - name: Build reference run
        run: python examples/build_nano_todo.py
      - name: Verify reference run
        env:
          FACTORY_ROOT: ${{ github.workspace }}/examples/nano-todo
          FACTORY_RUNS_ROOT: ${{ github.workspace }}/examples
        run: |
          factory verify --run-id nano-todo --stage s9_learn --require-gate
          factory trace --run-id nano-todo
          factory metrics --run-id nano-todo
          factory log verify --run-id nano-todo
      - name: Product tests
        run: python -m unittest discover -s examples/nano-todo/product/tests -v

  integration:
    # The trust boundary is a property of the machine, not of the Python
    # functions: real bwrap, real POSIX ACL, a separate uid, the root helper.
    # The unit tests can only show that the code asks for the right thing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install the boundary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap acl policykit-1
      - name: Install the root helper
        run: |
          python -c "from pathlib import Path; from factory.runtime.root_helper import render_helper_script; Path('/tmp/factory-root-helper').write_text(render_helper_script())"
          sudo install -D -m 0755 -o root -g root /tmp/factory-root-helper \
            /usr/local/libexec/factory-root-helper
          rm -f /tmp/factory-root-helper
      - name: Set up the executor user
        run: |
          # The helper installs its own polkit rule, but it needs root for
          # that — and the rule is what lets it run without a password.  On a
          # runner `sudo` is passwordless, so the first step goes through it.
          OPERATOR=$(id -un)
          sudo /usr/local/libexec/factory-root-helper install-policy "$OPERATOR"
          factory setup-executor --user factory-executor
      - name: Doctor
        run: factory doctor
      - name: The boundary, on the real machine
        run: |
          set -o pipefail
          pytest -q tests/test_runtime_trust_boundary.py -rs | tee /tmp/boundary.txt
      - name: What did not run
        run: |
          {
            echo "## Trust boundary: what did not run"
            echo
            grep -E "^SKIPPED" /tmp/boundary.txt || echo "- every boundary check ran"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The whole suite
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [test, eval]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: The distribution version must be the VERSION file
        run: |
          VERSION=$(cat VERSION)
          ls dist/*.whl | grep -q "autonomous_sw_factory-${VERSION}-" \
            || { echo "the wheel is not versioned ${VERSION}:"; ls dist/; exit 1; }
      - name: Test the built sdist in a clean environment
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --upgrade pip pytest
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          mkdir -p /tmp/sdist-src
          tar -xzf dist/*.tar.gz -C /tmp/sdist-src --strip-components=1
          cd /tmp/sdist-src
          /tmp/sdist-venv/bin/python -m pytest -q
      - name: Test the built wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          WHEEL_FILE=$(ls dist/*.whl | head -1)
          /tmp/wheel-venv/bin/pip install "${WHEEL_FILE}[xlsx]"
          /tmp/wheel-venv/bin/factory doctor
          /tmp/wheel-venv/bin/factory --help
          /tmp/wheel-venv/bin/factory ui --help
          VERSION=$(cat VERSION)
          FOUND=$(/tmp/wheel-venv/bin/python -c "import importlib.metadata; print(importlib.metadata.version('autonomous-sw-factory'))")
          test "$FOUND" = "$VERSION" \
            || { echo "the installed package says $FOUND, VERSION says $VERSION"; exit 1; }
