schema_version: "1.0.0"

# A blocking veto is a stop, not a comment. After this many reworks on the
# same stage the run is escalated to a human. max_veto_retries caps the
# per-stage max_attempts from pipeline.yaml; default_max_attempts is the
# fallback for a stage that declares no limit.
max_veto_retries: 3
default_max_attempts: 3

on_attempts_exhausted: "escalate"   # escalate | pause
on_budget_exhausted: "pause"
on_model_unavailable: "fallback_then_escalate"

# What the engine enforces: attempts per task (state.reject_task) and per gate
# (engine.gate_reject), plus the veto retry cap. `factory budget` prints these
# limits and the attempts already consumed.
#
# Token, minute and USD budgets live in pipeline.yaml under each mode and are
# enforced by the host runtime, not by this engine: journal events still carry
# no token or price fields, so cost_per_artifact_usd stays null.
enforce:
  tokens: true
  minutes: true
  usd: true

# Host replay of the independent verifier's checks (audit P0-2).
#
# The verifier's report names a command, the exit code it saw and the output it
# read.  Those are claims.  At gate closure the host now re-runs every claim
# whose argv starts with one of the prefixes below, in a fresh bubblewrap with
# a read-only filesystem and no network, and refuses the PASS if the real exit
# code or output differs.  A prefix matches a whole argv head: `pytest` admits
# `pytest -q tests/`, `make check` does not admit `make check-all`.
#
# The list is the operator's: it sits in the installed package, outside the run,
# and the executor sandbox cannot write to the package.  Shells and `env` are
# refused by `factory doctor` -- inside an allowlist they would re-interpret the
# argv the host built and turn the fence into a door.  An empty list disables
# the replay, and `factory doctor` then says that a PASS is prose only.
verify_commands:
  - ["python3", "-m", "pytest"]
  - ["python", "-m", "pytest"]
  - ["python3", "-m", "unittest"]
  - ["python", "-m", "unittest"]
  - ["pytest"]
  - ["go", "test"]
  - ["cargo", "test"]
  - ["npm", "test"]
  - ["pnpm", "test"]
  - ["yarn", "test"]
  - ["make", "check"]
  - ["make", "test"]

verify_timeout_s: 600       # per command; a hung suite refuses the PASS
verify_max_commands: 10     # distinct commands in one report, not blocks
verify_require_for_pass: true
verify_output: "strict"     # strict | ignore
