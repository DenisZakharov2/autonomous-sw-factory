<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory — пульт прогона</title>
<style>
:root{
  --bg:#0B0D12; --panel:#12151E; --panel2:#171B26; --line:#232837;
  --fg:#E7E9F0; --muted:#8B91A5;
  --accent:#6366F1; --ok:#10B981; --warn:#F59E0B; --err:#EF4444; --idle:#64748B;
  --radius:10px; --mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); min-width:min(1280px,100%);
  font:13px/1.45 -apple-system,"Segoe UI",Ubuntu,sans-serif;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3{margin:0;font-weight:600}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.num{text-align:right;font-family:var(--mono)}

/* ---------- top bar (P1, fixed) ---------- */
.topbar{
  position:sticky; top:0; z-index:40; display:flex; gap:16px; align-items:center; flex-wrap:nowrap;
  height:64px; padding:0 20px; background:var(--panel); border-bottom:1px solid var(--line);
  box-shadow:0 4px 14px rgba(0,0,0,.35); transition:box-shadow .15s ease-out;
}
body[data-tone="err"] .topbar{box-shadow:inset 0 -2px 0 rgba(239,68,68,.6), 0 4px 14px rgba(0,0,0,.35)}
body[data-tone="warn"] .topbar{box-shadow:inset 0 -2px 0 rgba(245,158,11,.55), 0 4px 14px rgba(0,0,0,.35)}
.brand{display:flex;flex-direction:column;gap:3px;min-width:240px;flex:1 1 280px;max-width:280px}
.brand .project{font-size:15px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .meta{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden}
.brand .meta .run{font-family:var(--mono);color:#aab0c2}
.brand .meta .back{color:var(--muted);text-decoration:none;border-bottom:1px dotted #3a4157;margin-left:4px}
.brand .meta .back:hover{color:var(--fg)}
.brand .meta .sep{opacity:.5}
.stageblock{display:flex;flex-direction:column;gap:3px;min-width:0;flex:0 1 auto;max-width:300px}
.stageblock .stage{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;white-space:nowrap}
.stageblock .stage #h-stage{overflow:hidden;text-overflow:ellipsis}
.stageblock .sub{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-cluster{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.toolbar{display:flex;gap:6px;align-items:center;flex:0 0 auto;padding-left:12px;border-left:1px solid var(--line)}
.btn{
  background:var(--panel2); border:1px solid var(--line); color:var(--fg);
  border-radius:7px; padding:4px 9px; font-size:12px; line-height:1.3; white-space:nowrap;
  transition:background .15s ease-out,border-color .15s ease-out;
}
.btn:hover{background:#1d2230;border-color:#2f3547}
.btn:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{border-color:#3b3f88;background:#1b1f3a}
.btn.icon{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}
select,.input{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:12px}
.live{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;white-space:nowrap}
.menu-wrap{position:relative}
.menu{
  position:absolute; right:0; top:30px; z-index:60; background:#0e1119; border:1px solid #2c3243;
  border-radius:8px; padding:4px; min-width:176px; box-shadow:0 8px 24px rgba(0,0,0,.5); display:flex; flex-direction:column;
}
.menu button{background:transparent;border:0;text-align:left;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--fg)}
.menu button:hover{background:#1b2130}
.menu-sep{height:1px;background:var(--line);margin:4px 2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(16,185,129,.5)}
.dot.fresh{animation:pulse 1.2s ease-out}
.dot.paused{background:var(--idle)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}100%{box-shadow:0 0 0 7px rgba(16,185,129,0)}}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel2);font-size:12px;white-space:nowrap
}
.badge.ok{color:var(--ok);border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08)}
.badge.warn{color:var(--warn);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
.badge.err{color:var(--err);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}
.badge.idle{color:var(--muted);border-style:solid}
.badge.active{color:var(--accent);border-color:rgba(99,102,241,.5);background:rgba(99,102,241,.1)}
.badge .ico{font-size:11px}

/* ---------- grid ---------- */
.grid{
  display:grid; grid-template-columns:repeat(12,1fr); grid-auto-rows:56px;
  grid-auto-flow:row dense; gap:12px; padding:16px 24px 40px;
}
.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  display:flex; flex-direction:column; min-width:0; overflow:hidden; position:relative;
  transition:border-color .15s ease-out,opacity .15s ease-out;
}
[hidden]{display:none !important}
.panel.dragging{opacity:.45}
.panel.drop-before::before,.panel.drop-after::after{
  content:""; position:absolute; left:0; right:0; height:3px; background:var(--accent); z-index:5; border-radius:2px;
}
.panel.drop-before::before{top:-8px}
.panel.drop-after::after{bottom:-8px}
.panel-head{
  display:flex; align-items:center; gap:8px; height:32px; padding:0 8px 0 10px;
  border-bottom:1px solid var(--line); background:var(--panel2);
  cursor:grab; user-select:none; flex:none;
}
.panel-head:active{cursor:grabbing}
.panel-head h2{font-size:13px;font-weight:600}
.panel-head .grip{color:#3d4459;font-size:11px;letter-spacing:-1px}
.panel-head .head-badge{margin-left:auto;color:var(--muted);font-size:11px;font-family:var(--mono)}
.panel-actions{display:flex;gap:2px;align-items:center}
.icon-btn{
  background:transparent;border:1px solid transparent;border-radius:6px;color:var(--muted);
  width:22px;height:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0
}
.icon-btn:hover{background:#20263a;color:var(--fg)}
.panel-body{flex:1;min-height:0;overflow:auto;padding:12px}
.resize{
  position:absolute; right:0; bottom:0; width:16px; height:16px; cursor:nwse-resize; touch-action:none;
  background:linear-gradient(135deg,transparent 50%,#333a4f 50%,#333a4f 60%,transparent 60%,transparent 72%,#333a4f 72%,#333a4f 82%,transparent 82%);
  opacity:.7;
}
.resize:hover{opacity:1}
.panel-settings{
  position:absolute; top:34px; right:8px; z-index:20; background:#0e1119;
  border:1px solid #2c3243; border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.5); font-size:12px;
}
.panel-settings label{display:flex;justify-content:space-between;gap:12px;align-items:center}

/* ---------- shared bits ---------- */
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--panel);text-align:left;color:#9aa1b5;font-weight:500;font-size:11px;
  letter-spacing:.02em;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
td{padding:6px 8px;border-bottom:1px solid #1b1f2b;vertical-align:top;white-space:nowrap}
td.wrap{white-space:normal}
.cut-text{display:block;max-width:60ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#151926}
*{scrollbar-width:thin;scrollbar-color:#2b3142 transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b3142;border-radius:6px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.empty{color:var(--muted);padding:8px 0}
.errbox{border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.07);color:#ffb4b4;border-radius:8px;padding:8px 10px;margin:8px 0}
.warnbox{border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.07);color:#ffd79a;border-radius:8px;padding:8px 10px;margin:8px 0}

/* ---------- stages ---------- */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:6px}
.chip{
  display:flex;flex-direction:column;gap:3px;padding:6px 9px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel2);font-size:12px;line-height:1.15;min-width:0;
}
.chip .top{display:flex;align-items:center;gap:6px;min-width:0}
.chip .ico{font-size:10px;width:10px;text-align:center;flex:none}
.chip .name{font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dur{margin-left:auto;color:var(--muted);font-size:10.5px;white-space:nowrap;flex:none}
.chip .bottom{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px;min-width:0}
.chip .g{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .m{font-family:var(--mono);margin-left:auto;white-space:nowrap;flex:none}
.chip.ok{border-color:rgba(16,185,129,.35)}
.chip.ok .ico{color:var(--ok)}
.chip.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(99,102,241,.35) inset;animation:breathe 2.6s ease-in-out infinite}
.chip.active .ico{color:var(--accent)}
.chip.warn{border-color:rgba(245,158,11,.4)} .chip.warn .ico{color:var(--warn)}
.chip.err{border-color:rgba(239,68,68,.45)} .chip.err .ico{color:var(--err)}
.chip.idle .ico{color:var(--idle)}
.chip.na{opacity:.45;border-style:dashed}
@keyframes breathe{0%,100%{box-shadow:0 0 0 1px rgba(99,102,241,.25) inset}50%{box-shadow:0 0 0 3px rgba(99,102,241,.28) inset}}

/* ---------- P3 ---------- */
.now-grid{display:flex;flex-direction:column;gap:8px}
.now-title{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.now-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.now-line .value{font-size:13px;font-weight:600}
.now-event{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel2)}
.now-event .line1{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.now-event .seq{font-family:var(--mono);color:var(--muted);font-size:11px}
.now-event .meaning{color:#d5d9e5;font-size:12.5px;line-height:1.35}
.now-event .meta{color:var(--muted);font-size:11.5px;margin-top:3px}
.counters{display:flex;flex-wrap:wrap;gap:5px}
.counter{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-size:11.5px}
.counter b{font-family:var(--mono)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel2)}
.stat .k{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:15px;font-family:var(--mono);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:11px;color:var(--muted);font-family:inherit}
.stat .v.multi{font-size:11.5px;line-height:1.55;white-space:normal}
/* P8 fits nine values into its 6x3 default without scrolling */
.panel[data-panel="p8"] .panel-body{padding:8px}
.panel[data-panel="p8"] .stats{gap:6px;margin-bottom:0}
.panel[data-panel="p8"] .stat{padding:3px 7px}
.panel[data-panel="p8"] .stat .k{font-size:9.5px;line-height:1.25}
.panel[data-panel="p8"] .stat .v{font-size:12.5px;line-height:1.25;margin-top:1px}
.panel[data-panel="p8"] .stat .v.multi{font-size:10.5px}
.bar{height:6px;background:#1b1f2b;border-radius:4px;overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;background:var(--accent)}
.bar>span.warn{background:var(--warn)} .bar>span.err{background:var(--err)}
.budget{margin-bottom:12px}
.budget .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:2px}

/* ---------- trace ---------- */
.cover{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.cover .big{font-size:22px;font-family:var(--mono)}
.cover .bar{flex:1;margin-top:0}
.reqs{font-family:var(--mono);font-size:11px}
.p7-tools{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.journal-table{table-layout:fixed}
.journal-table td{overflow:hidden;text-overflow:ellipsis}
.journal-table .cut-text{max-width:none}
.p7-tools select{font-size:11.5px;padding:2px 6px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;font-family:var(--mono);color:var(--muted);display:inline-block;margin:1px 2px 1px 0;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
.tags{display:flex;gap:2px;flex-wrap:nowrap;overflow:hidden;max-width:250px}
.tag.err{color:#ffb4b4;border-color:rgba(239,68,68,.45)}
.tag.ok{color:#8ff0c8;border-color:rgba(16,185,129,.35)}

/* ---------- runs list ---------- */
.runs-view{padding:24px}
.runs-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.runs-head h1{font-size:18px}
.runs-table td,.runs-table th{padding:8px 10px;font-size:12.5px}
.runs-table td:first-child{font-weight:500}
.runs-table tbody tr{cursor:pointer}
.runs-table tbody tr:hover{background:#171c29}
.runs-table .proj{max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runs-scroll{overflow-x:auto}

/* ---------- toast ---------- */
#toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;
  background:#0e1119;border:1px solid #2c3243;border-radius:8px;padding:8px 14px;font-size:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .15s ease-out;max-width:70vw
}
#toast.show{opacity:1}
#toast.err{border-color:rgba(239,68,68,.5);color:#ffb4b4}

.catalog{position:absolute;right:0;top:34px;z-index:60;background:#0e1119;border:1px solid #2c3243;border-radius:8px;padding:8px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.catalog label{display:flex;gap:8px;align-items:center;padding:3px 4px;font-size:12px}
.catalog .hint{color:var(--muted);font-size:11px;padding:4px;border-top:1px solid var(--line);margin-top:6px}
.rel{position:relative}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

/* ---------- drawer (P7) ---------- */
.drawer-overlay{
  position:fixed; inset:0; z-index:70; background:rgba(11,13,18,.55);
  backdrop-filter:blur(4px); display:none; align-items:flex-start;
}
.drawer{
  position:fixed; top:0; right:0; z-index:80;
  width:420px; max-width:calc(100vw - 24px); height:100%; background:var(--panel);
  border-left:1px solid var(--line); box-shadow:-6px 0 24px rgba(0,0,0,.4);
  display:flex; flex-direction:column; animation:drawerIn .2s ease-out;
}
.drawer-head{
  height:48px; border-bottom:1px solid var(--line); padding:0 14px; display:flex;
  align-items:center; gap:10px; flex-shrink:0;
}
.drawer-head h2{font-size:15px;flex:1}
.drawer-body{
  overflow-y:auto; padding:14px 18px; flex:1; font-size:12.5px; line-height:1.5;
}
.drawer-body h3{font-size:12px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.drawer-body .kv{margin-bottom:8px;display:flex;gap:10px}
.drawer-body .kv .k{min-width:110px;color:var(--muted);font-family:var(--mono);font-size:11px}
.drawer-body .kv .v{flex:1;white-space:pre-wrap;overflow-wrap:break-word}
.drawer-body .evidence{margin-top:6px;background:#0e1119;border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:break-word;font-family:var(--mono);font-size:11px;color:#aab0c2}
.drawer-body .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.drawer-body .tag{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px}
.drawer-body table{width:100%;border-collapse:collapse;margin-top:6px}
.drawer-body th{text-align:left;font-size:11px;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
.drawer-body td{font-size:11.5px;padding:4px 6px;border-bottom:1px solid #1c2130;vertical-align:top}
.drawer-body tr:hover td{background:#171b26}
.drawer-close{background:transparent;border:0;color:var(--fg);font-size:18px;line-height:1;padding:2px}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.journal-row{cursor:pointer}
.journal-row:hover{background:#171b26}
.drawer-empty{color:var(--muted);font-style:italic}
</style>
</head>
<body>

<section id="view-runs" class="runs-view" hidden>
  <div class="runs-head">
    <h1>Factory</h1><span class="muted">прогоны</span>
    <span class="muted" id="runs-count"></span>
    <span class="live" style="margin-left:auto"><i class="dot" id="runs-dot"></i><span id="runs-live">обновляется</span></span>
    <a class="btn" href="/api/export/runs.csv" style="align-self:center" title="Экспорт списка прогонов в CSV">CSV</a>
  </div>
  <div id="runs-body"><div class="empty">Загрузка…</div></div>
</section>

<section id="view-run" hidden>
  <header class="topbar">
    <div class="brand">
      <div class="project" id="h-project">—</div>
      <div class="meta"><span class="run" id="h-run">—</span><span class="sep">·</span><span id="h-mode">—</span>
        <a href="/" id="h-back" class="back">все прогоны</a></div>
    </div>
    <div class="stageblock">
      <div class="stage"><span id="h-stage-status" class="badge idle">—</span><span id="h-stage">—</span></div>
      <div class="sub"><span id="h-expected">—</span> · <span id="h-age" class="mono">—</span></div>
    </div>
    <div class="status-cluster">
      <span class="badge idle" id="h-chain"><span class="ico">◇</span><span>цепочка не проверена</span></span>
      <span class="live"><i class="dot" id="live-dot"></i><span id="live-text">—</span></span>
    </div>
    <div class="toolbar">
      <select id="preset" title="Пресет раскладки">
        <option value="operator">Оператор</option>
        <option value="finops">FinOps</option>
        <option value="audit">Аудит</option>
        <option value="custom">Свой</option>
      </select>
      <div class="rel">
        <button class="btn" id="btn-catalog" aria-expanded="false">Панели</button>
        <div class="catalog" id="catalog" hidden></div>
      </div>
      <button class="btn" id="btn-pause" aria-pressed="false">Пауза</button>
      <div class="menu-wrap" id="export-wrap">
        <button class="btn icon" id="btn-export" aria-expanded="false" aria-haspopup="true" aria-label="Экспорт ▾" title="Экспорт ▾">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="M7 1.5v6.5M4.2 5.6 7 8.4l2.8-2.8M2.5 11.5h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="menu" id="menu-export" hidden>
          <button type="button" data-export="journal">Журнал · CSV</button>
          <button type="button" data-export="tasks">Задачи · CSV</button>
          <button type="button" data-export="usage">Расход · CSV</button>
          <button type="button" data-export="trace">Трассировка · CSV</button>
          <button type="button" data-export="xlsx">Книга · XLSX</button>
          <div class="menu-sep"></div>
          <button type="button" data-export="runs">Все прогоны · CSV</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="btn" id="btn-layout" aria-expanded="false" title="Экспорт, импорт и сброс раскладки">Раскладка ▾</button>
        <div class="menu" id="menu-layout" hidden>
          <button type="button" data-layout="export">Экспорт раскладки</button>
          <button type="button" data-layout="import">Импорт раскладки</button>
          <button type="button" data-layout="default">По умолчанию</button>
        </div>
      </div>
    </div>
  </header>
  <div class="grid" id="grid"></div>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const POLL_MS = 2000;                     // §6: один опрос раз в 2 с, вкладка видима
const STORAGE_KEY = "ftcs.layout.v1";
const CUSTOM_KEY = "ftcs.layout.custom.v1";
const PANEL_IDS = ["p2", "p3", "p4", "p5", "p6", "p7", "p8"];
const META = {
  p2: { title: "Стадии", badge: "13" },
  p3: { title: "Сейчас", badge: "" },
  p4: { title: "Задачи", badge: "" },
  p5: { title: "Расход", badge: "usage.jsonl" },
  p6: { title: "Трассировка", badge: "REQ" },
  p7: { title: "Журнал", badge: "50" },
  p8: { title: "Метрики", badge: "9" }
};
const PRESETS = {
  operator: { label: "Оператор", order: ["p2", "p3", "p4", "p7"],
    size: { p2: [12, 3], p3: [4, 4], p4: [8, 4], p7: [12, 4] } },
  finops: { label: "FinOps", order: ["p2", "p5"],
    size: { p2: [12, 3], p5: [12, 4] } },
  audit: { label: "Аудит", order: ["p2", "p6", "p8", "p7"],
    size: { p2: [12, 2], p6: [12, 4], p8: [6, 3], p7: [12, 4] } }
};
const STATUS = {
  accepted: { ico: "✓", label: "принято", cls: "ok" },
  approved: { ico: "✓", label: "одобрен", cls: "ok" },
  in_progress: { ico: "●", label: "в работе", cls: "active" },
  review: { ico: "◷", label: "на проверке", cls: "warn" },
  needs_human: { ico: "◷", label: "нужен человек", cls: "warn" },
  blocked: { ico: "✕", label: "вето", cls: "err" },
  escalated: { ico: "✕", label: "эскалация", cls: "err" },
  rejected: { ico: "✕", label: "отклонён", cls: "err" },
  pending: { ico: "○", label: "ожидает", cls: "idle" },
  PASS: { ico: "✓", label: "PASS", cls: "ok" },
  FAIL: { ico: "✕", label: "FAIL", cls: "err" },
  VETO: { ico: "✕", label: "VETO", cls: "err" },
  ACCEPTED_RISK: { ico: "◷", label: "риск принят", cls: "warn" },
  DRAFT: { ico: "○", label: "draft", cls: "idle" }
};

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (value) => String(value == null ? "" : value)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const nf = new Intl.NumberFormat("ru-RU");
const num = (v) => (v == null ? "—" : nf.format(Math.round(v)));

function statusBadge(value, id) {
  const attr = id ? ` id="${id}"` : "";
  const st = STATUS[value];
  if (!st) return `<span class="badge idle"${attr}><span class="ico">·</span><span>${esc(value || "—")}</span></span>`;
  return `<span class="badge ${st.cls}"${attr}><span class="ico">${st.ico}</span><span>${esc(st.label)}</span></span>`;
}
function numCell(v) {
  if (v == null) return '<span class="muted">не измерено</span>';
  if (typeof v === "number" && !Number.isInteger(v)) return v.toFixed(2);
  return num(v);
}
function secondsLabel(sec) {
  if (sec == null) return "—";
  if (sec < 90) return `${Math.round(sec)} с`;
  if (sec < 5400) return `${Math.round(sec / 60)} мин`;
  const hours = Math.floor(sec / 3600);
  return `${hours} ч ${Math.round((sec % 3600) / 60)} мин`;
}
function ageLabel(sec) {
  if (sec == null) return "—";
  if (sec < 120) return `${Math.round(sec)} с назад`;
  if (sec < 7200) return `${Math.round(sec / 60)} мин назад`;
  if (sec < 172800) return `${Math.round(sec / 3600)} ч назад`;
  return `${Math.round(sec / 86400)} дн назад`;
}
function shortTime(stamp) {
  if (!stamp) return "—";
  const d = new Date(stamp);
  if (Number.isNaN(d.getTime())) return String(stamp);
  return d.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

// ---------------- layout model ----------------
function defaultSettings() {
  return { p2: { view: "chips" }, p5: { groupBy: "stage" }, p7: { filter: "all", limit: 50 } };
}
function presetLayout(name) {
  const preset = PRESETS[name] || PRESETS.operator;
  const visible = preset.order.slice();
  const rest = PANEL_IDS.filter((id) => !visible.includes(id));
  const size = {};
  for (const id of PANEL_IDS) {
    const spec = preset.size[id] || [6, 3];
    size[id] = [clamp(spec[0], 3, 12), clamp(spec[1], 1, 4)];
  }
  return {
    version: 1, preset: PRESETS[name] ? name : "operator",
    order: visible.concat(rest), hidden: rest.slice(), size, settings: defaultSettings()
  };
}
function sanitizeLayout(raw) {
  if (!raw || typeof raw !== "object" || raw.version !== 1) return null;
  const order = [];
  if (Array.isArray(raw.order)) {
    for (const id of raw.order) if (PANEL_IDS.includes(id) && !order.includes(id)) order.push(id);
  }
  const hidden = Array.isArray(raw.hidden) ? raw.hidden.filter((id) => PANEL_IDS.includes(id)) : [];
  for (const id of PANEL_IDS) {
    if (order.includes(id)) continue;
    order.push(id);
    // a panel this stored layout predates starts hidden, not uninvited
    if (Array.isArray(raw.order) && !hidden.includes(id)) hidden.push(id);
  }
  const size = {};
  for (const id of PANEL_IDS) {
    const spec = raw.size && raw.size[id];
    if (Array.isArray(spec) && spec.length === 2) {
      size[id] = [clamp(Math.round(Number(spec[0])) || 6, 3, 12), clamp(Math.round(Number(spec[1])) || 3, 1, 4)];
    }
  }
  const settings = defaultSettings();
  const given = raw.settings && typeof raw.settings === "object" ? raw.settings : {};
  if (given.p2 && ["chips", "table"].includes(given.p2.view)) settings.p2.view = given.p2.view;
  if (given.p5 && ["stage", "role", "task"].includes(given.p5.groupBy)) settings.p5.groupBy = given.p5.groupBy;
  if (given.p7) {
    if (["all", "FAIL", "VETO"].includes(given.p7.filter)) settings.p7.filter = given.p7.filter;
    if (given.p7.limit != null) settings.p7.limit = clamp(Math.round(Number(given.p7.limit)) || 50, 10, 50);
  }
  const preset = ["operator", "finops", "audit", "custom"].includes(raw.preset) ? raw.preset : "custom";
  return { version: 1, preset, order, hidden, size, settings };
}
function readStored(key) {
  try { return sanitizeLayout(JSON.parse(localStorage.getItem(key) || "null")); }
  catch (err) { return null; }
}
function writeStored(key) {
  try { localStorage.setItem(key, JSON.stringify(layout)); }
  catch (err) { toast("Не удалось сохранить раскладку: " + err.message, true); }
}

let layout = presetLayout("operator");
let payload = null;
let chain = null;
let runId = null;
let etag = null;
let paused = false;
let timer = null;
let ticker = null;
let lastPollAt = 0;
let dragId = null;

// ---------------- panel scaffolding ----------------
function buildPanel(id) {
  const panel = document.createElement("section");
  panel.className = "panel";
  panel.dataset.panel = id;
  panel.tabIndex = 0;
  panel.innerHTML = `
    <div class="panel-head" draggable="true">
      <span class="grip" aria-hidden="true">⠿</span>
      <h2>${esc(META[id].title)}</h2>
      <span class="head-badge">${esc(META[id].badge)}</span>
      <span class="panel-actions" draggable="false">
        <button class="icon-btn" data-act="settings" title="Настройки панели" aria-label="Настройки панели ${esc(META[id].title)}">⋯</button>
        <button class="icon-btn" data-act="hide" title="Скрыть панель" aria-label="Скрыть панель ${esc(META[id].title)}">✕</button>
      </span>
    </div>
    <div class="panel-body"><div class="empty">загрузка…</div></div>
    <div class="panel-settings" hidden></div>
    <div class="resize" title="Изменить размер" role="separator" aria-label="Изменить размер панели ${esc(META[id].title)}"></div>`;
  return panel;
}

function panelNode(id) { return document.querySelector(`.panel[data-panel="${id}"]`); }

function applyLayout() {
  const grid = $("#grid");
  if (!grid) return;
  if (!grid.children.length) for (const id of PANEL_IDS) grid.appendChild(buildPanel(id));
  for (const id of layout.order) {
    const panel = panelNode(id);
    if (!panel) continue;
    const spec = layout.size[id] || [6, 3];
    panel.style.gridColumn = `span ${spec[0]}`;
    panel.style.gridRow = `span ${spec[1]}`;
    panel.hidden = layout.hidden.includes(id);
    grid.appendChild(panel);
  }
  $("#preset").value = layout.preset;
}

function markCustom() {
  layout.preset = "custom";
  writeStored(CUSTOM_KEY);
}
function saveLayout() { writeStored(STORAGE_KEY); applyLayout(); $("#preset").value = layout.preset; }

function movePanel(id, targetId, after) {
  const order = layout.order.filter((item) => item !== id);
  const index = order.indexOf(targetId);
  if (index < 0) return;
  order.splice(after ? index + 1 : index, 0, id);
  layout.order = order;
  markCustom(); saveLayout();
}
function setSize(id, width, height) {
  layout.size[id] = [clamp(width, 3, 12), clamp(height, 1, 4)];
  markCustom(); saveLayout();
}
function toggleHidden(id, hidden) {
  layout.hidden = hidden
    ? Array.from(new Set(layout.hidden.concat([id])))
    : layout.hidden.filter((item) => item !== id);
  markCustom(); saveLayout();
  renderCatalog();
}

// ---------------- runs view ----------------
async function loadRuns() {
  try {
    const headers = {};
    if (runsEtag) headers["If-None-Match"] = runsEtag;
    const res = await fetch("/api/runs", { headers });
    if (res.status === 304) { flashDot("runs-dot"); scheduleRuns(); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    runsEtag = res.headers.get("ETag");
    const data = await res.json();
    renderRuns(data);
    flashDot("runs-dot");
  } catch (err) {
    $("#runs-body").innerHTML = `<div class="errbox">Не удалось прочитать список прогонов: ${esc(err.message)}</div>`;
  }
  scheduleRuns();
}
let runsEtag = null;
let runsTimer = null;
function scheduleRuns() {
  if (document.visibilityState !== "visible") return;
  clearTimeout(runsTimer);
  runsTimer = setTimeout(loadRuns, POLL_MS);
}
function renderRuns(data) {
  const runs = data.runs || [];
  const params = new URLSearchParams(location.search);
  const q = (params.get("q") || "").toLowerCase();
  let filtered = runs;
  if (q) {
    filtered = runs.filter((r) => {
      const haystack = [r.project, r.run_id, r.mode, r.stage, r.stage_status].map((x) => String(x || "").toLowerCase()).join(" ");
      return haystack.includes(q);
    });
  }
  const sortKey = params.get("sort") || "updated_at";
  const dir = params.get("dir") === "asc" ? 1 : -1;
  function cmp(a, b) {
    const av = a[sortKey]; const bv = b[sortKey];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === "number" && typeof bv === "number") return (av - bv) * dir;
    return String(av).localeCompare(String(bv)) * dir;
  }
  const sorted = filtered.slice().sort((a, b) => cmp(a, b) || String(a.run_id || "").localeCompare(String(b.run_id || "")));
  const rows = sorted.map((run) => {
    if (run.error) {
      return `<tr data-run="${esc(run.run_id)}"><td class="proj">${esc(run.project)}</td><td class="mono">${esc(run.run_id)}</td>
        <td colspan="2"><span class="badge err"><span class="ico">✕</span><span>state.json не читается</span></span></td>
        <td>—</td><td>—</td><td class="muted">${esc(run.error)}</td></tr>`;
    }
    const stageCell = run.stage
      ? `<span class="mono">${esc(run.stage)}</span>`
      : '<span class="muted">завершён</span>';
    return `<tr data-run="${esc(run.run_id)}">
      <td class="proj" title="${esc(run.project)}">${esc(run.project)}</td>
      <td class="mono">${esc(run.run_id)}</td>
      <td>${esc(run.mode || "—")}</td>
      <td>${stageCell}</td>
      <td>${run.stage_status ? statusBadge(run.stage_status) : '<span class="badge idle"><span class="ico">○</span><span>завершён</span></span>'}</td>
      <td class="num">${run.tokens == null ? '<span class="muted">не измерено</span>' : num(run.tokens)}</td>
      <td class="nowrap muted">${esc(shortTime(run.updated_at))}</td>
    </tr>`;
  }).join("");
  const header = `<div class="runs-scroll"><table class="runs-table">
    <thead><tr>
      <th data-sort="project">Проект</th>
      <th data-sort="run_id">run_id</th>
      <th data-sort="mode">Режим</th>
      <th data-sort="stage">Стадия</th>
      <th data-sort="stage_status">Статус</th>
      <th data-sort="tokens" style="text-align:right">Токены</th>
      <th data-sort="updated_at">Обновлён</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
  const count = q ? `найдено ${sorted.length} из ${runs.length}` : `${runs.length} прогонов`;
  if (!sorted.length) {
    $("#runs-body").innerHTML = `<div class="empty">ничего не найдено — <a href="#" id="runs-reset">сбросить</a></div>`;
    const r = $("#runs-reset");
    if (r) r.addEventListener("click", (e) => { e.preventDefault(); history.replaceState(null, "", location.pathname); loadRuns(); });
    return;
  }
  $("#runs-body").innerHTML = header;
  $("#runs-count").textContent = count;
  for (const row of document.querySelectorAll("#runs-body tbody tr")) {
    row.addEventListener("click", () => { location.search = `?run=${encodeURIComponent(row.dataset.run)}`; });
  for (const r of document.querySelectorAll("tr.stage-row")) { r.addEventListener("click", () => showDrawerStage(r.dataset.stage)); }
  for (const r of document.querySelectorAll("tr.journal-row")) { r.addEventListener("click", () => showDrawerEvent(r.dataset.seq)); }
  for (const r of document.querySelectorAll("#runs-body tbody tr")) { r.addEventListener("click", () => { location.search = `?run=${encodeURIComponent(r.dataset.run)}`; }); }
  }
  for (const th of document.querySelectorAll("#runs-body thead th")) {
    th.style.cursor = "pointer";
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      const cur = params.get("sort") || "updated_at";
      let ndir = (cur === key && params.get("dir") !== "asc") ? "asc" : "desc";
      if (cur !== key) ndir = (key === "tokens" || key === "updated_at") ? "desc" : "asc";
      const np = new URLSearchParams(location.search);
      np.set("sort", key);
      np.set("dir", ndir);
      np.set("q", q);
      history.replaceState(null, "", "?" + np.toString());
      loadRuns();
    });
  }
}

// ---------------- payload rendering ----------------
function renderHeader(data) {
  const head = data.header;
  $("#h-project").textContent = head.project;
  $("#h-project").title = head.project;
  $("#h-run").textContent = data.run_id;
  $("#h-mode").textContent = `режим ${head.mode}`;
  $("#h-stage").textContent = head.current_stage ? `${head.current_stage} · ${head.stage_title}` : "прогон завершён";
  $("#h-stage-status").outerHTML = statusBadge(head.stage_status, "h-stage-status");
  $("#h-expected").textContent = `${data.now.expected}${head.gate ? " · гейт " + head.gate + (head.gate_status ? " (" + head.gate_status + ")" : "") : ""}`;
  $("#h-age").textContent = eventAge();
  const status = head.stage_status;
  const gate = head.gate_status;
  document.body.dataset.tone =
    status === "escalated" || status === "blocked" || gate === "rejected" ? "err"
    : status === "review" || gate === "needs_human" ? "warn" : "";
  renderChainBadge();
}

function renderStages(data) {
  const view = layout.settings.p2.view;
  const body = panelNode("p2").querySelector(".panel-body");
  const head = panelNode("p2").querySelector(".head-badge");
  head.textContent = `${data.stages.filter((s) => s.applicable).length}/13`;
  if (!data.stages.length) { body.innerHTML = '<div class="empty">стадий нет</div>'; return; }
  if (view === "table") {
    body.innerHTML = `<table><thead><tr><th>Стадия</th><th>Статус</th><th>Гейт</th><th>Попытки</th>
      <th class="num">Токены</th><th class="num">Секунды</th></tr></thead><tbody>
      ${data.stages.map((stage) => {
        const st = STATUS[stage.status] || { ico: "○", label: stage.status || "—", cls: "idle" };
        const cls = stage.applicable ? st.cls : "idle";
        return `<tr data-stage="${esc(stage.id)}" class="stage-row"><td class="mono">${esc(stage.id)}</td>
          <td>${stage.applicable
            ? `<span class="badge ${cls}"><span class="ico">${st.ico}</span><span>${esc(st.label)}</span></span>`
            : '<span class="badge idle" style="border-style:dashed"><span class="ico">–</span><span>не применима</span></span>'}</td>
          <td class="mono">${esc(stage.gate)} ${stage.gate_status ? `<span class="muted">${esc(stage.gate_status)}</span>` : ""}</td>
          <td class="mono">${stage.attempts}/${stage.max_attempts ?? "—"}</td>
          <td class="num">${numCell(stage.tokens)}</td><td class="num">${stage.seconds == null ? "—" : Number(stage.seconds).toFixed(1)}</td></tr>`;
      }).join("")}</tbody></table>`;
    return;
  }
  body.innerHTML = `<div class="chips">${data.stages.map((stage) => {
    const st = STATUS[stage.status] || { ico: "○", label: stage.status || "—", cls: "idle" };
    const active = data.header.current_stage === stage.id;
    const cls = [stage.applicable ? st.cls : "idle na", active ? "active" : ""].join(" ").trim();
    const gate = `${stage.gate}${stage.gate_status ? " · " + stage.gate_status : ""}`;
    const title = `${stage.id} — ${stage.title}\nстатус: ${stage.applicable ? st.label : "не применима"}\nгейт: ${stage.gate}${stage.gate_status ? " (" + stage.gate_status + ")" : ""}\nпопытки: ${stage.attempts}/${stage.max_attempts ?? "—"}\nтокены: ${stage.tokens == null ? "—" : num(stage.tokens)} · ${stage.seconds == null ? "—" : Number(stage.seconds).toFixed(1) + " с"}`;
    return `<div class="chip ${cls}" title="${esc(title)}">
      <div class="top"><span class="ico" aria-hidden="true">${stage.applicable ? st.ico : "–"}</span>
        <span class="name">${esc(stage.id)}</span>
        <span class="dur">${stage.seconds == null ? "" : secondsLabel(stage.seconds)}</span></div>
      <div class="bottom"><span class="g">${stage.applicable ? esc(gate) : "не применима"}</span>
        <span class="m">${stage.attempts}/${stage.max_attempts ?? "—"}</span></div>
    </div>`;
  }).join("")}</div>`;
}

function renderNow(data) {
  const body = panelNode("p3").querySelector(".panel-body");
  const now = data.now;
  const last = now.last_event;
  const eventHtml = last ? `<div class="now-event">
      <div class="line1"><span class="seq">#${esc(last.seq)}</span>
        <span class="mono">${esc(last.event_type)}</span>
        ${last.verdict ? `<span class="badge ${(STATUS[last.verdict] || {}).cls || "idle"}"><span class="ico">${(STATUS[last.verdict] || {}).ico || "·"}</span><span>${esc(last.verdict)}</span></span>` : ""}
        <span class="muted nowrap" style="margin-left:auto">${esc(shortTime(last.timestamp_utc))}</span></div>
      <div class="meaning">${esc(last.meaning || "—")}</div>
      <div class="meta">роль <span class="mono">${esc(last.role || "—")}</span>
        · стадия <span class="mono">${esc(last.stage || "—")}</span>
        · ${ageLabel(data.header.seconds_since_event)}</div>
      ${last.action ? `<div class="meta">действие: ${esc(last.action)}</div>` : ""}
    </div>` : '<div class="empty">событий пока нет</div>';
  const counters = Object.entries(now.task_counts).sort().map(([status, count]) => {
    const st = STATUS[status] || { ico: "·", cls: "idle" };
    return `<span class="counter ${st.cls}"><span>${st.ico}</span><span class="muted">${esc(status)}</span><b>${count}</b></span>`;
  }).join("");
  body.innerHTML = `<div class="now-grid">
    <div class="now-line"><span class="now-title">ожидаемое действие</span><span class="value">${esc(now.expected)}</span></div>
    ${eventHtml}
    <div><div class="now-title" style="margin-bottom:4px">задачи (${now.task_total})</div>
      <div class="counters">${counters || '<span class="muted">задач нет</span>'}</div></div>
  </div>`;
  panelNode("p3").querySelector(".head-badge").textContent = last ? `#${last.seq}` : "";
}

function renderTasks(data) {
  const body = panelNode("p4").querySelector(".panel-body");
  panelNode("p4").querySelector(".head-badge").textContent = String(data.tasks.length);
  if (!data.tasks.length) { body.innerHTML = '<div class="empty">задач пока нет</div>'; return; }
  body.innerHTML = `<table><thead><tr><th>Задача</th><th>Владелец</th><th>REQ</th><th>Статус</th>
    <th class="num">Попытки</th><th>Lease</th><th>Отказы</th><th>Файлы</th></tr></thead><tbody>
    ${data.tasks.map((task) => {
      const st = STATUS[task.status] || { ico: "○", label: task.status, cls: "idle" };
      const files = task.allowed_files || [];
      const shown = files.slice(0, 2).map((f) => `<span class="tag" title="${esc(f)}">${esc(f)}</span>`).join("");
      const more = files.length > 2 ? `<span class="tag">+${files.length - 2}</span>` : "";
      const reasons = (task.reject_reasons || []).map((r) => `<div class="tag err">${esc(r)}</div>`).join("");
      return `<tr><td class="mono">${esc(task.task_id)}</td>
        <td class="mono wrap" style="max-width:150px">${esc(task.owner)}</td>
        <td class="reqs">${(task.reqs || []).map((r) => `<span class="tag">${esc(r)}</span>`).join("")}</td>
        <td><span class="badge ${st.cls}"><span class="ico">${st.ico}</span><span>${esc(st.label)}</span></span></td>
        <td class="mono num">${task.attempts}</td>

    }).join("")}</tbody></table>`;
}

function applyJournalFilter(verdict, stage, type, q = "") {
  const params = new URLSearchParams(location.search);
  params.set("verdict", verdict === "all" ? "" : verdict);
  params.set("stage", stage || "");
  params.set("event_type", type || "");
  params.set("q", q || "");
  history.replaceState(null, "", "?" + params.toString());
  loadRun();
}
function resetJournalFilters() {
  history.replaceState(null, "", "");
  loadRun();
}

async function checkChain() {
  const btn = $("btn-chain");

  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/chain?refresh=1`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

  } catch (err) {
    toast("Проверка цепочки не удалась: " + err.message, true);
  }
  renderChainBadge();
  if (payload) renderJournal(payload);
}

function flashDot(id) {
  const dot = document.getElementById(id);
  if (!dot) return;
  dot.classList.remove("fresh");
  void dot.offsetWidth;
  dot.classList.add("fresh");
}

function applyPayload(data) {
  payload = data;
  renderHeader(data);
  renderStages(data);
  renderNow(data);
  renderTasks(data);
  renderUsage(data);
  renderMetrics(data);
  renderTrace(data);
  renderJournal(data);
  lastPollAt = Date.now();
}

async function poll() {
  clearTimeout(timer);
  if (paused) return;
  if (document.visibilityState !== "visible") { schedule(); return; }
  try {
    const headers = etag ? { "If-None-Match": etag } : {};
    const url = new URL(`/api/runs/${encodeURIComponent(runId)}`, location.origin);
    const _sp = new URLSearchParams(location.search);
    for (const k of ["verdict", "stage", "event_type", "limit"]) {
      const v = _sp.get(k);
      if (v) url.searchParams.set(k, v);
    }
    const res = await fetch(url.pathname + url.search, { headers });
    if (res.status === 304) {
      lastPollAt = Date.now();
      $("#live-dot").classList.remove("paused");
      flashDot("live-dot");
    } else if (res.ok) {
      etag = res.headers.get("ETag");
      applyPayload(await res.json());
      $("#live-dot").classList.remove("paused");
      flashDot("live-dot");
    } else {
      const text = await res.text();
      throw new Error(`HTTP ${res.status}: ${text.slice(0, 200)}`);
    }
  } catch (err) {
    $("#live-text").textContent = "ошибка обновления: " + err.message;
    $("#live-dot").classList.add("paused");
  }
  schedule();
}
function schedule() {
  if (paused) return;
  clearTimeout(timer);
  timer = setTimeout(poll, POLL_MS);
}

function eventAge() {
  const last = payload && payload.now && payload.now.last_event;
  if (!last || !last.timestamp_utc) return "событий нет";
  const when = Date.parse(last.timestamp_utc);
  if (Number.isNaN(when)) return "—";
  return "событие " + ageLabel((Date.now() - when) / 1000);
}

function tick() {
  if (!payload || !payload.header) return;
  const age = document.getElementById("h-age");
  if (age) age.textContent = eventAge();
  const live = $("#live-text");
  if (paused) { live.textContent = "пауза"; return; }
  if (!lastPollAt) { live.textContent = "—"; return; }
  const ago = Math.round((Date.now() - lastPollAt) / 1000);
  live.textContent = ago < 1 ? "только что" : `${ago} с назад`;
}

function toast(message, isError) {
  const box = $("#toast");
  box.textContent = message;
  box.className = "show" + (isError ? " err" : "");
  clearTimeout(box._timer);
  box._timer = setTimeout(() => { box.className = ""; }, 4000);
}

function download(url) {
  // No `download` attribute: the server's Content-Disposition names the file,
  // and an attachment response saves instead of navigating away.
  const link = document.createElement("a");
  link.href = url;
  document.body.appendChild(link);
  link.click();
  link.remove();
}

function exportLayout() {
  const blob = new Blob([JSON.stringify(layout, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "factory-layout.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  toast("раскладка выгружена");
}

function importLayout(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try {
      parsed = JSON.parse(String(reader.result));
    } catch (err) {
      toast("битый JSON: " + err.message, true);
      return;
    }
    const clean = sanitizeLayout(parsed);
    if (!clean) { toast("это не раскладка dashboard (нет version: 1)", true); return; }
    layout = clean;
    saveLayout();
    buildCatalog();
    if (payload) applyPayload(payload);
    toast("раскладка импортирована");
  };
  reader.onerror = () => toast("файл не прочитался", true);
  reader.readAsText(file);
}

function switchPreset(name) {
  if (name === "custom") {
    const custom = readStored(CUSTOM_KEY);
    if (!custom) { toast("своя раскладка ещё не сохранена"); $("#preset").value = layout.preset; return; }
    layout = custom;
  } else {
    const next = presetLayout(name);
    next.settings = layout.settings;   // настройки панелей — предпочтение, не раскладка
    layout = next;
  }
  saveLayout();
  buildCatalog();
  if (payload) applyPayload(payload);
}

function editionWiring() {
  $("#preset").addEventListener("change", (ev) => switchPreset(ev.target.value));
  $("#btn-catalog").addEventListener("click", () => {
    const box = $("#catalog");
    box.hidden = !box.hidden;
    $("#btn-catalog").setAttribute("aria-expanded", String(!box.hidden));
    if (!box.hidden) buildCatalog();
  });
  $("#btn-pause").addEventListener("click", () => {
    paused = !paused;
    $("#btn-pause").textContent = paused ? "Продолжить" : "Пауза";
    $("#btn-pause").setAttribute("aria-pressed", String(paused));
    $("#live-dot").classList.toggle("paused", paused);
    if (paused) { clearTimeout(timer); tick(); }
    else { poll(); }
  });
  $("#btn-layout").addEventListener("click", () => {
    const menu = $("#menu-layout");
    menu.hidden = !menu.hidden;
    $("#btn-layout").setAttribute("aria-expanded", String(!menu.hidden));
    if (!menu.hidden) { $("#menu-export").hidden = true; $("#btn-export").setAttribute("aria-expanded", "false"); }
  });
  $("#btn-export").addEventListener("click", () => {
    const menu = $("#menu-export");
    menu.hidden = !menu.hidden;
    $("#btn-export").setAttribute("aria-expanded", String(!menu.hidden));
    if (!menu.hidden) { $("#menu-layout").hidden = true; $("#btn-layout").setAttribute("aria-expanded", "false"); }
  });
  for (const item of document.querySelectorAll("#menu-export [data-export]")) {
    item.addEventListener("click", () => {
      $("#menu-export").hidden = true;
      $("#btn-export").setAttribute("aria-expanded", "false");
      const kind = item.dataset.export;
      if (kind === "runs") { download("/api/export/runs.csv"); return; }
      if (!payload) { toast("прогон ещё не загружен", true); return; }
      const base = "/api/runs/" + encodeURIComponent(payload.run_id);
      if (kind === "xlsx") { download(base + "/export.xlsx"); toast("книга .xlsx собирается"); }
      else { download(base + "/export/" + kind + ".csv"); toast("скачивается CSV"); }
    });
  }
  for (const item of document.querySelectorAll("#menu-layout [data-layout]")) {
    item.addEventListener("click", () => {
      $("#menu-layout").hidden = true;
      $("#btn-layout").setAttribute("aria-expanded", "false");
      if (item.dataset.layout === "export") exportLayout();
      else if (item.dataset.layout === "import") $("#import-file").click();
      else resetLayout();
    });
  }
  function resetLayout() {
    layout = presetLayout("operator");
    saveLayout();
    buildCatalog();
    if (payload) applyPayload(payload);
    toast("раскладка по умолчанию");
  }
  $("#import-file").addEventListener("change", (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (file) importLayout(file);
    ev.target.value = "";
  });
  document.addEventListener("click", (ev) => {
    if (!ev.target.closest(".rel")) { $("#catalog").hidden = true; }
    if (!ev.target.closest(".menu-wrap")) {
      $("#menu-layout").hidden = true;
      $("#btn-layout").setAttribute("aria-expanded", "false");
    }
    if (!ev.target.closest("#export-wrap")) {
      $("#menu-export").hidden = true;
      $("#btn-export").setAttribute("aria-expanded", "false");
    }
    if (!ev.target.closest(".panel-settings") && !ev.target.closest('[data-act="settings"]')) {
      for (const box of document.querySelectorAll(".panel-settings")) box.hidden = true;
    }
  });
}

function panelWiring() {
  const grid = $("#grid");
  for (const panel of document.querySelectorAll(".panel")) {
    const id = panel.dataset.panel;
    const header = panel.querySelector(".panel-head");
    header.addEventListener("dragstart", (ev) => {
      dragId = id;
      panel.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      try { ev.dataTransfer.setData("text/plain", id); } catch (err) { /* Firefox needs a payload */ }
    });
    header.addEventListener("dragend", () => {
      dragId = null;
      panel.classList.remove("dragging");
      for (const node of document.querySelectorAll(".panel")) node.classList.remove("drop-before", "drop-after");
    });
    panel.addEventListener("dragover", (ev) => {
      if (!dragId || dragId === id) return;
      ev.preventDefault();
      ev.dataTransfer.dropEffect = "move";
      const box = panel.getBoundingClientRect();
      const after = ev.clientY > box.top + box.height / 2;
      panel.classList.toggle("drop-after", after);
      panel.classList.toggle("drop-before", !after);
    });
    panel.addEventListener("dragleave", () => panel.classList.remove("drop-before", "drop-after"));
    panel.addEventListener("drop", (ev) => {
      if (!dragId || dragId === id) return;
      ev.preventDefault();
      const box = panel.getBoundingClientRect();
      const after = ev.clientY > box.top + box.height / 2;
      const source = dragId;
      panel.classList.remove("drop-before", "drop-after");
      movePanel(source, id, after);
    });

    panel.querySelector('[data-act="hide"]').addEventListener("click", (ev) => {
      ev.stopPropagation();
      toggleHidden(id, true);
    });
    panel.querySelector('[data-act="settings"]').addEventListener("click", (ev) => {
      ev.stopPropagation();
      const box = panel.querySelector(".panel-settings");
      const wasHidden = box.hidden;
      for (const other of document.querySelectorAll(".panel-settings")) other.hidden = true;
      if (wasHidden) renderSettings(id);
    });
    panel.querySelector(".panel-settings").addEventListener("change", (ev) => {
      const key = ev.target.dataset.setting;
      if (!key) return;
      const [panelId, name] = key.split(".");
      let value = ev.target.value;
      if (name === "limit") value = clamp(Math.round(Number(value)) || 50, 10, 50);
      layout.settings[panelId][name] = value;
      markCustom(); saveLayout();
      if (payload) {
        if (panelId === "p2") renderStages(payload);
        if (panelId === "p5") renderUsage(payload);
        if (panelId === "p7") renderJournal(payload);
      }
    });

    // resize
    const handle = panel.querySelector(".resize");
    handle.addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      try { handle.setPointerCapture(ev.pointerId); } catch (err) { /* synthetic or stale pointer */ }
      const box = panel.getBoundingClientRect();
      const gridBox = grid.getBoundingClientRect();
      const gridStyle = getComputedStyle(grid);
      const content = gridBox.width - parseFloat(gridStyle.paddingLeft) - parseFloat(gridStyle.paddingRight);
      const gap = parseFloat(gridStyle.columnGap) || 12;
      const colUnit = (content - 11 * gap) / 12 + gap;
      const rowUnit = parseFloat(gridStyle.gridAutoRows) + gap;
      const startX = ev.clientX;
      const startY = ev.clientY;
      const startW = box.width;
      const startH = box.height;
      const [curW, curH] = layout.size[id] || [6, 3];
      let next = [curW, curH];
      const onMove = (moveEv) => {
        const width = startW + (moveEv.clientX - startX);
        const height = startH + (moveEv.clientY - startY);
        const cols = clamp(Math.round((width + 12) / colUnit), 3, 12);
        const rows = clamp(Math.round((height + 12) / rowUnit), 1, 4);
        next = [cols, rows];
        panel.style.gridColumn = `span ${cols}`;
        panel.style.gridRow = `span ${rows}`;
      };
      const onUp = () => {
        handle.removeEventListener("pointermove", onMove);
        handle.removeEventListener("pointerup", onUp);
        handle.removeEventListener("pointercancel", onUp);
        if (next[0] !== curW || next[1] !== curH) setSize(id, next[0], next[1]);
      };
      handle.addEventListener("pointermove", onMove);
      handle.addEventListener("pointerup", onUp);
      handle.addEventListener("pointercancel", onUp);
    });

    panel.addEventListener("keydown", (ev) => {
      if (!ev.altKey) return;
      const [width, height] = layout.size[id] || [6, 3];
      if (ev.key === "ArrowUp" && !ev.shiftKey) { reorderBy(id, -1); }
      else if (ev.key === "ArrowDown" && !ev.shiftKey) { reorderBy(id, 1); }
      else if (ev.key === "ArrowLeft") { setSize(id, width - 1, height); }
      else if (ev.key === "ArrowRight") { setSize(id, width + 1, height); }
      else if (ev.key === "ArrowUp" && ev.shiftKey) { setSize(id, width, height - 1); }
      else if (ev.key === "ArrowDown" && ev.shiftKey) { setSize(id, width, height + 1); }
      else return;
      ev.preventDefault();
    });
  }
}

function reorderBy(id, delta) {
  const order = layout.order.slice();
  const index = order.indexOf(id);
  const target = index + delta;
  if (target < 0 || target >= order.length) return;
  order.splice(index, 1);
  order.splice(target, 0, id);
  layout.order = order;
  markCustom(); saveLayout();
  panelNode(id).focus();
}

// ---------------- boot ----------------
function boot() {
  const params = new URLSearchParams(location.search);
  runId = params.get("run");
  if (!runId) {
    $("#view-runs").hidden = false;
    loadRuns();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") loadRuns();
    });
    return;
  }
  $("#view-run").hidden = false;
  const stored = readStored(STORAGE_KEY);
  if (stored) {
    layout = stored;
  } else {
    const preset = params.get("preset");
    layout = presetLayout(PRESETS[preset] ? preset : "operator");
    writeStored(STORAGE_KEY);
  }
  applyLayout();
  editionWiring();
  panelWiring();
  buildCatalog();
  poll();
  ticker = setInterval(tick, 1000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !paused) poll();
  });
}


// ---------------- drawer wiring ----------------
let lastFocused = null;
function openDrawer(title, html) {
  const drawer = $("#drawer");
  const overlay = $("#drawer-overlay");
  const body = $("#drawer-body");
  const titleEl = $("#drawer-title");
  if (!drawer || !overlay || !body) return;
  titleEl.textContent = title;
  body.innerHTML = html;
  drawer.hidden = false;
  overlay.hidden = false;
  document.body.style.overflow = "hidden";
  lastFocused = document.activeElement;
}
function closeDrawer() {
  const drawer = $("#drawer");
  const overlay = $("#drawer-overlay");
  if (!drawer || !overlay) return;
  drawer.hidden = true;
  overlay.hidden = true;
  document.body.style.overflow = "";
  if (lastFocused && typeof lastFocused.focus === "function") lastFocused.focus();
  lastFocused = null;
  const params = new URLSearchParams(location.search);
  params.delete("event");
  const qs = params.toString();
  history.replaceState(null, "", qs ? ("?" + qs) : location.pathname);
}

function escHtml(s) { return esc(s == null ? "" : String(s)); }

async function showDrawerStage(stageId) {
  const stage = (payload && payload.stages) ? payload.stages.find((s) => s.id === stageId) : null;
  if (!stage) { toast("стадию не удалось найти", true); return; }
  const gateHtml = stage.gate
    ? `<h3>Гейт</h3>
       <div class="kv"><span class="k">гейт</span><span class="v">${escHtml(stage.gate)}</span></div>
       <div class="kv"><span class="k">статус</span><span class="v">${escHtml(stage.gate_status || "—")}</span></div>
       <div class="kv"><span class="k">кто принял</span><span class="v">${escHtml(stage.gate_decided_by || "—")}</span></div>
       <div class="kv"><span class="k">когда</span><span class="v">${escHtml(stage.gate_decided_at || "—")}</span></div>` : "";
  const evidenceHtml = stage.gate_evidence ? `<h3>Evidence гейта</h3><div class="evidence">${escHtml(Array.isArray(stage.gate_evidence) ? stage.gate_evidence.join("\n") : stage.gate_evidence)}</div>` : "";
  const attemptsHtml = `<div class="kv"><span class="k">попытки</span><span class="v">${stage.attempts}/${stage.max_attempts || "—"}</span></div>`;
  const tasksHtml = (stage.tasks || []).length
    ? `<h3>Задачи стадии (${stage.tasks.length})</h3><table><thead><tr><th>Задача</th><th>Статус</th><th>Попытки</th><th>Отказы</th></tr></thead><tbody>
      ${stage.tasks.map((t) => `<tr class="drawer-link" data-task="${escHtml(t.task_id)}"><td class="mono">${escHtml(t.task_id)}</td>
        <td>${escHtml(t.status || "—")}</td><td class="num">${escHtml(t.attempts || 0)}</td><td>${escHtml((t.reject_reasons || []).length ? t.reject_reasons.join("; ") : "—")}</td></tr>`).join("")}
      </tbody></table>` : "";
  openDrawer(`Стадия ${escHtml(stageId)}`, `
    <div class="kv"><span class="k">id</span><span class="v">${escHtml(stage.id)}</span></div>
    <div class="kv"><span class="k">заголовок</span><span class="v">${escHtml(stage.title || "—")}</span></div>
    <div class="kv"><span class="k">статус</span><span class="v">${escHtml(stage.status || "—")}</span></div>
    ${attemptsHtml}${gateHtml}${evidenceHtml}${tasksHtml}
  `);
  for (const tr of drawer.querySelectorAll("tr.drawer-link")) {
    tr.addEventListener("click", () => showDrawerTask(tr.dataset.task));
  }
}

async function showDrawerTask(taskId) {
  const task = (payload && payload.tasks) ? payload.tasks.find((t) => t.task_id === taskId) : null;
  if (!task) { toast("задачу не удалось найти", true); return; }
  const artifactsHtml = (task.artifacts || []).length
    ? `<h3>Артефакты (${task.artifacts.length})</h3><ul class="tag-row">
      ${task.artifacts.map((a) => `<li class="tag">${escHtml(a)}</li>`).join("")}
    </ul>` : "<p class=\"drawer-empty\">артефактов нет</p>";
  const reasonsHtml = (task.reject_reasons || []).length
    ? `<h3>Отказы</h3><div class="tag-row">
      ${task.reject_reasons.map((r) => `<div class="tag err">${escHtml(r)}</div>`).join("")}
    </div>` : "<p class=\"drawer-empty\">отказов нет</p>";
  openDrawer(`Задача ${escHtml(taskId)}`, `
    <div class="kv"><span class="k">id</span><span class="v">${escHtml(task.task_id)}</span></div>
    <div class="kv"><span class="k">стадия</span><span class="v">${escHtml(task.stage || "—")}</span></div>
    <div class="kv"><span class="k">владелец</span><span class="v">${escHtml(task.owner || "—")}</span></div>
    <div class="kv"><span class="k">статус</span><span class="v">${escHtml(task.status || "—")}</span></div>
    <div class="kv"><span class="k">попытки</span><span class="v">${escHtml(task.attempts || 0)}</span></div>
    <div class="kv"><span class="k">lease</span><span class="v">${escHtml(task.lease || "—")}</span></div>
    <div class="kv"><span class="k">REQ</span><span class="v">${escHtml((task.reqs || []).join(", ") || "—")}</span></div>
    <div class="kv"><span class="k">разрешенные файлы</span><span class="v">${escHtml((task.allowed_files || []).join("\n") || "—")}</span></div>
    <div class="kv"><span class="k">artefacts</span><span class="v">${escHtml((task.artifacts || []).length ? task.artifacts.join("\n") : "—")}</span></div>
    ${artifactsHtml}${reasonsHtml}
  `);
}

async function showDrawerEvent(seq) {
  openDrawer(`Событие #${seq}`, '<div class="muted" style="padding-top:40px">загружаю…</div>');
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(payload.run_id)}/events/${seq}`);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    const ev = await res.json();
    const verdict = ev.verdict || {};
    const arts = ev.artifacts || [];
    const evidenceHtml = verdict.evidence ? `<h3>Evidence</h3><div class="evidence">${escHtml(verdict.evidence)}</div>` : "";
    const artifactsHtml = arts.length
      ? `<h3>Артефакты (${arts.length})</h3><table><thead><tr><th>Путь</th><th>Байт</th><th>SHA-256</th></tr></thead><tbody>
      ${arts.map((a) => `<tr><td class="mono">${escHtml(a.path || "—")}</td>
        <td class="num">${escHtml(a.bytes || "—")}</td><td class="mono">${escHtml(a.sha256 || "—")}</td></tr>`).join("")}
      </tbody></table>` : "<p class=\"drawer-empty\">артефактов нет</p>";
    openDrawer(`Событие #${escHtml(seq)}`, `
      <div class="kv"><span class="k">seq</span><span class="v">${escHtml(ev.seq)}</span></div>
      <div class="kv"><span class="k">event_id</span><span class="v mono">${escHtml(ev.event_id || "—")}</span></div>
      <div class="kv"><span class="k">время</span><span class="v">${escHtml(ev.timestamp_utc || "—")}</span></div>
      <div class="kv"><span class="k">стадия</span><span class="v mono">${escHtml(ev.stage || "—")}</span></div>
      <div class="kv"><span class="k">задача</span><span class="v mono">${escHtml(ev.task_id || "—")}</span></div>
      <div class="kv"><span class="k">роль</span><span class="v mono">${escHtml(ev.role || "—")}</span></div>
      <div class="kv"><span class="k">тип</span><span class="v mono">${escHtml(ev.event_type)}</span></div>
      <div class="kv"><span class="k">действие</span><span class="v">${escHtml(ev.action || "—")}</span></div>
      <div class="kv"><span class="k">why</span><span class="v">${escHtml(ev.why || "—")}</span></div>
      <div class="kv"><span class="k">for_what</span><span class="v">${escHtml(ev.for_what || "—")}</span></div>
      <div class="kv"><span class="k">вердикт</span><span class="v">${escHtml(verdict.status || "—")}</span></div>
      <div class="kv"><span class="k">кто верифицировал</span><span class="v">${escHtml(verdict.verified_by || "—")}</span></div>
      <div class="kv"><span class="k">код причины</span><span class="v mono">${escHtml(verdict.reason_code || "—")}</span></div>
      ${evidenceHtml}
      <div class="kv"><span class="k">хэш</span><span class="v mono">${escHtml(ev.hash || "—")}</span></div>
      <div class="kv"><span class="k">prev_hash</span><span class="v mono">${escHtml(ev.prev_hash || "—")}</span></div>
      ${artifactsHtml}
    `);
  } catch (err) {
    toast("событие не загрузилось: " + err.message, true);
  }
}

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") {
    const drawer = $("#drawer");
    if (drawer && !drawer.hidden) closeDrawer();
  }
});
const overlayEl = $("#drawer-overlay");
if (overlayEl) overlayEl.addEventListener("click", closeDrawer);
const closeBtn = $("#drawer-close");
if (closeBtn) closeBtn.addEventListener("click", closeDrawer);

// Deep link for event drawer
setTimeout(() => {
  const params = new URLSearchParams(location.search);
  const evSeq = params.get("event");
  if (evSeq && payload) {
    showDrawerEvent(Number(evSeq));
  }
}, 500);


boot();
</script>
