[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-sw-factory"
version = "0.3.0"
description = "Runtime-agnostic, auditable software factory kit with stage gates, task work orders and a hash-chained flight recorder."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Denis Zakharov", email = "DenisZakharov2@users.noreply.github.com" }]
keywords = ["agents", "software-factory", "orchestration", "audit", "sha256"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "build>=1.2",
]

[project.scripts]
factory = "factory.cli:main"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.setuptools.package-data]
factory = ["pipeline.yaml", "models.yaml", "budget.yaml", "artifacts.yaml", "FACTORY_GLOSSARY.md", "orchestrator/*.md", "roles/*.md", "schemas/*.json", "templates/*.tmpl", "memory/*.md", "runtime/fixtures/nano/*", "runtime/fixtures/nano/*/*", "runtime/fixtures/nano/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
